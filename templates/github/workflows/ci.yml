# The merge gate: the project's check command must pass before a human merges.
# Replace the setup step and CHECK command with your stack's.
#
# Pull requests run the packages a change affects (use your build tool's affected filter when it has
# one). The push to main runs everything: it catches what the filter missed and what two pull
# requests break only together, and it seeds caches that pull requests reuse.
#
# Docs-only changes skip CI. If branch protection marks this job as required, a skipped run blocks
# the merge: either drop paths-ignore or don't mark the job required.

name: CI

on:
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Pin actions to a commit SHA: tags can move. Update the SHA and its comment together.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Set up your toolchain here, pinned to the latest release's commit SHA, for example
      # actions/setup-node, actions/setup-python, or actions/setup-go; then install dependencies.

      - name: Check
        # Lint, typecheck, and test: affected packages on pull_request, everything on push.
        # Prove each part fails on a planted error before relying on it.
        run: echo "Replace with the project's check command" && exit 1
